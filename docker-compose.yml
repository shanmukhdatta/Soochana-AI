version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soochana-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SKIP_MODEL_LOAD=${SKIP_MODEL_LOAD:-true}
      - MODEL_DEVICE=cpu
      - ENVIRONMENT=production
      - MARKETAUX_API_TOKEN=${MARKETAUX_API_TOKEN:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - INGESTION_ADMIN_TOKEN=${INGESTION_ADMIN_TOKEN:-production_admin_secret_token_change_me_1234}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - soochana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soochana-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - soochana-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  soochana-network:
    driver: bridge
